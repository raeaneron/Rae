<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus — Weather Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@300;400;500;700;800&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet">
  <style>
    /* ── THEME VARIABLES (updated dynamically) ── */
    :root {
      --sky-top: #0a1628;
      --sky-mid: #0e2447;
      --sky-btm: #1a3a6b;
      --glow: rgba(100, 160, 255, 0.18);
      --glass: rgba(255, 255, 255, 0.07);
      --glass-bd: rgba(255, 255, 255, 0.13);
      --text: #f0f4ff;
      --text-2: rgba(240, 244, 255, 0.65);
      --text-3: rgba(240, 244, 255, 0.38);
      --accent: #6aaeff;
      --accent-glow: rgba(106, 174, 255, 0.3);
      --radius: 20px;
      --radius-sm: 12px;
      --blur: blur(18px);
    }

    /* ── WEATHER THEMES ── */
    body.theme-clear-day {
      --sky-top: #0066cc;
      --sky-mid: #0099ff;
      --sky-btm: #66ccff;
      --accent: #ffd700;
      --accent-glow: rgba(255, 215, 0, 0.35);
      --glow: rgba(255, 200, 50, 0.15);
    }

    body.theme-clear-night {
      --sky-top: #010b1a;
      --sky-mid: #051630;
      --sky-btm: #0a2447;
      --accent: #a0c4ff;
      --accent-glow: rgba(160, 196, 255, 0.3);
      --glow: rgba(80, 120, 200, 0.12);
    }

    body.theme-clouds {
      --sky-top: #2d3748;
      --sky-mid: #3d4f6e;
      --sky-btm: #546380;
      --accent: #b0c4de;
      --accent-glow: rgba(176, 196, 222, 0.3);
      --glow: rgba(120, 140, 180, 0.15);
    }

    body.theme-rain {
      --sky-top: #111827;
      --sky-mid: #1f2d40;
      --sky-btm: #263447;
      --accent: #60a5fa;
      --accent-glow: rgba(96, 165, 250, 0.3);
      --glow: rgba(60, 100, 180, 0.2);
    }

    body.theme-storm {
      --sky-top: #0d0d0d;
      --sky-mid: #1a1a2e;
      --sky-btm: #16213e;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.4);
      --glow: rgba(200, 100, 0, 0.2);
    }

    body.theme-snow {
      --sky-top: #b8cce8;
      --sky-mid: #cddaf0;
      --sky-btm: #dde8f5;
      --accent: #fff;
      --accent-glow: rgba(255, 255, 255, 0.5);
      --glow: rgba(200, 220, 255, 0.2);
      --text: #1a2a4a;
      --text-2: rgba(26, 42, 74, 0.7);
      --text-3: rgba(26, 42, 74, 0.45);
      --glass: rgba(255, 255, 255, 0.25);
      --glass-bd: rgba(255, 255, 255, 0.5);
    }

    body.theme-mist {
      --sky-top: #8a9bb0;
      --sky-mid: #a8b8c8;
      --sky-btm: #c0cedb;
      --accent: #e8f0f8;
      --accent-glow: rgba(200, 220, 240, 0.4);
      --glow: rgba(150, 170, 200, 0.2);
      --text: #1a2a3a;
      --text-2: rgba(26, 42, 58, 0.65);
      --text-3: rgba(26, 42, 58, 0.4);
      --glass: rgba(255, 255, 255, 0.2);
      --glass-bd: rgba(255, 255, 255, 0.4);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      font-family: 'Cabinet Grotesk', sans-serif;
      min-height: 100vh;
      background: linear-gradient(175deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-btm) 100%);
      color: var(--text);
      transition: background 1.4s ease, color 0.8s;
      position: relative;
      overflow-x: hidden;
    }

    /* ── ATMOSPHERE LAYER ── */
    .atmo {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .atmo-glow {
      position: absolute;
      border-radius: 50%;
      background: var(--glow);
      filter: blur(80px);
      transition: all 1.4s ease;
    }

    .atmo-glow-1 {
      width: 700px;
      height: 700px;
      top: -200px;
      right: -150px;
    }

    .atmo-glow-2 {
      width: 500px;
      height: 500px;
      bottom: -100px;
      left: -100px;
      opacity: 0.6;
    }

    /* Particle canvas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.7;
    }

    /* ── LAYOUT ── */
    .shell {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      font-family: 'Instrument Serif', serif;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
      opacity: 0.9;
    }

    .brand em {
      color: var(--accent);
      font-style: italic;
      transition: color 0.8s;
    }

    /* Search bar */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: 100px;
      padding: 0.45rem 0.45rem 0.45rem 1.1rem;
      backdrop-filter: var(--blur);
      transition: border-color 0.2s, background 0.8s;
      flex: 1;
      max-width: 360px;
    }

    .search-wrap:focus-within {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.11);
    }

    .search-input {
      background: none;
      border: none;
      outline: none;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      flex: 1;
      min-width: 0;
    }

    .search-input::placeholder {
      color: var(--text-3);
    }

    .search-btn {
      background: var(--accent);
      color: var(--sky-top);
      border: none;
      border-radius: 100px;
      padding: 0.45rem 1rem;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s, background 0.8s, color 0.8s;
    }

    .search-btn:hover {
      opacity: 0.88;
      transform: scale(0.98);
    }

    .unit-toggle {
      display: flex;
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: 100px;
      padding: 3px;
      backdrop-filter: var(--blur);
    }

    .unit-btn {
      background: none;
      border: none;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-2);
      cursor: pointer;
      padding: 0.25rem 0.7rem;
      border-radius: 100px;
      transition: all 0.2s;
    }

    .unit-btn.active {
      background: var(--accent);
      color: var(--sky-top);
    }

    /* ── HERO ── */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      align-items: start;
    }

    /* Main weather card */
    .main-card {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius);
      backdrop-filter: var(--blur);
      padding: 2.5rem;
      transition: background 0.8s;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .location-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .location-pin {
      font-size: 1rem;
      color: var(--accent);
      transition: color 0.8s;
    }

    .location-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .location-country {
      font-size: 0.8rem;
      color: var(--text-3);
      margin-left: 0.25rem;
    }

    .location-time {
      font-size: 0.8rem;
      color: var(--text-3);
      margin-left: auto;
    }

    .temp-display {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
      margin-bottom: 1rem;
    }

    .temp-big {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(5rem, 12vw, 8rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .temp-big sup {
      font-size: 2rem;
      vertical-align: super;
      color: var(--text-2);
    }

    .temp-meta {
      padding-top: 1rem;
    }

    .weather-icon-big {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 0.5rem;
      display: block;
    }

    .weather-desc {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--text);
      text-transform: capitalize;
      margin-bottom: 0.25rem;
    }

    .feels-like {
      font-size: 0.8rem;
      color: var(--text-3);
    }

    /* Stats strip */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-top: 2rem;
      border-top: 1px solid var(--glass-bd);
      padding-top: 1.5rem;
    }

    .stat-item {
      text-align: center;
      position: relative;
    }

    .stat-item+.stat-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      bottom: 15%;
      width: 1px;
      background: var(--glass-bd);
    }

    .stat-val {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .stat-lbl {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .stat-icon {
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }

    /* Side panel */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* UV / Air card */
    .glass-card {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius);
      backdrop-filter: var(--blur);
      padding: 1.5rem;
      transition: background 0.8s;
      animation: fadeUp 0.6s ease both;
    }

    .card-label {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 1rem;
    }

    /* Sun times */
    .sun-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .sun-item {
      text-align: center;
    }

    .sun-icon {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    .sun-time {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .sun-name {
      font-size: 0.7rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Sun arc */
    .sun-arc-wrap {
      margin: 1rem 0 0.5rem;
      position: relative;
      height: 48px;
    }

    .sun-arc-wrap svg {
      width: 100%;
      height: 100%;
    }

    /* Extra stats */
    .extra-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .extra-item {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius-sm);
      padding: 0.9rem;
      text-align: center;
    }

    .extra-val {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
    }

    .extra-lbl {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    /* ── 5-DAY FORECAST ── */
    .forecast-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .forecast-card {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius);
      backdrop-filter: var(--blur);
      padding: 1.25rem 0.75rem;
      text-align: center;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
      cursor: default;
      animation: fadeUp 0.6s ease both;
    }

    .forecast-card:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .forecast-day {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 0.6rem;
    }

    .forecast-icon {
      font-size: 2rem;
      margin-bottom: 0.6rem;
      display: block;
    }

    .forecast-hi {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .forecast-lo {
      font-size: 0.85rem;
      color: var(--text-3);
      margin-top: 0.1rem;
    }

    .forecast-desc {
      font-size: 0.7rem;
      color: var(--text-2);
      margin-top: 0.5rem;
      text-transform: capitalize;
    }

    .forecast-rain {
      font-size: 0.7rem;
      color: #60a5fa;
      margin-top: 0.3rem;
    }

    /* ── HOURLY STRIP ── */
    .hourly-wrap {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius);
      backdrop-filter: var(--blur);
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      animation: fadeUp 0.6s ease both;
    }

    .hourly-wrap::-webkit-scrollbar {
      display: none;
    }

    .hourly-inner {
      display: flex;
      gap: 1.25rem;
      min-width: max-content;
    }

    .hour-item {
      text-align: center;
    }

    .hour-time {
      font-size: 0.68rem;
      color: var(--text-3);
      margin-bottom: 0.5rem;
      letter-spacing: 0.06em;
    }

    .hour-icon {
      font-size: 1.4rem;
      margin-bottom: 0.4rem;
      display: block;
    }

    .hour-temp {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .hour-rain {
      font-size: 0.65rem;
      color: #60a5fa;
      margin-top: 0.2rem;
    }

    .hourly-label {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 1rem;
    }

    /* ── LOADING / ERROR ── */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 1.25rem;
      text-align: center;
    }

    .loader-ring {
      width: 60px;
      height: 60px;
      border: 3px solid var(--glass-bd);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-screen p {
      color: var(--text-2);
      font-size: 0.9rem;
    }

    .error-card {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      color: #fca5a5;
      font-size: 0.88rem;
      max-width: 480px;
      margin: 2rem auto;
      text-align: center;
      display: none;
    }

    /* API Key prompt */
    .key-prompt {
      background: var(--glass);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius);
      backdrop-filter: var(--blur);
      padding: 2.5rem;
      text-align: center;
      max-width: 520px;
      margin: 0 auto;
    }

    .key-prompt h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .key-prompt p {
      color: var(--text-2);
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .key-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-bd);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 0.75rem;
      transition: border-color 0.2s;
    }

    .key-input:focus {
      border-color: var(--accent);
    }

    .key-submit {
      width: 100%;
      background: var(--accent);
      color: var(--sky-top);
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.8rem;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 0.75rem;
    }

    .key-submit:hover {
      opacity: 0.88;
    }

    .key-hint {
      font-size: 0.75rem;
      color: var(--text-3);
    }

    .key-hint a {
      color: var(--accent);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 820px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .side-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .forecast-row {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 560px) {
      .forecast-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .side-panel {
        grid-template-columns: 1fr;
      }

      .stats-strip {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        border: none;
        padding-top: 1.25rem;
      }

      .stat-item+.stat-item::before {
        display: none;
      }
    }
  </style>
</head>

<body class="theme-clear-night">

  <!-- atmosphere -->
  <div class="atmo">
    <div class="atmo-glow atmo-glow-1"></div>
    <div class="atmo-glow atmo-glow-2"></div>
  </div>
  <canvas id="particle-canvas"></canvas>

  <div class="shell">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="brand">N<em>i</em>mbus</div>
      <div class="search-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="Search city..." autocomplete="off">
        <button class="search-btn" id="search-btn">Search</button>
      </div>
      <div class="unit-toggle">
        <button class="unit-btn active" data-unit="metric">°C</button>
        <button class="unit-btn" data-unit="imperial">°F</button>
      </div>
    </header>

    <!-- CONTENT -->
    <div id="content"></div>

  </div>

  <script>
    // ── CONFIG ──
    const API_BASE = 'https://api.openweathermap.org/data/2.5';
    let API_KEY = localStorage.getItem('nimbus_api_key') || '';
    let units = 'metric';
    let lastCity = localStorage.getItem('nimbus_last_city') || '';

    // ── WEATHER ICON MAP ──
    const ICON = {
      '01d': '☀️', '01n': '🌙', '02d': '⛅', '02n': '☁️',
      '03d': '☁️', '03n': '☁️', '04d': '☁️', '04n': '☁️',
      '09d': '🌧️', '09n': '🌧️', '10d': '🌦️', '10n': '🌧️',
      '11d': '⛈️', '11n': '⛈️', '13d': '❄️', '13n': '❄️',
      '50d': '🌫️', '50n': '🌫️',
    };

    function getIcon(code) { return ICON[code] || '🌡️'; }

    // ── THEME MAP ──
    function applyTheme(iconCode, isDay) {
      const body = document.body;
      body.className = '';
      const id = iconCode?.slice(0, 2);
      if (id === '01' && isDay) body.classList.add('theme-clear-day');
      else if (id === '01') body.classList.add('theme-clear-night');
      else if (['02', '03', '04'].includes(id)) body.classList.add('theme-clouds');
      else if (['09', '10'].includes(id)) body.classList.add('theme-rain');
      else if (id === '11') body.classList.add('theme-storm');
      else if (id === '13') body.classList.add('theme-snow');
      else if (id === '50') body.classList.add('theme-mist');
      else body.classList.add('theme-clear-night');
      updateParticles(id, isDay);
    }

    // ── PARTICLES ──
    const canvas = document.getElementById('particle-canvas');
    const pCtx = canvas.getContext('2d');
    let particles = [];
    let particleType = 'none';
    let animFrame;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function updateParticles(id, isDay) {
      particles = [];
      cancelAnimationFrame(animFrame);
      if (['09', '10'].includes(id)) { particleType = 'rain'; spawnParticles(120); animateParticles(); }
      else if (id === '11') { particleType = 'storm'; spawnParticles(80); animateParticles(); }
      else if (id === '13') { particleType = 'snow'; spawnParticles(80); animateParticles(); }
      else if (id === '01' && isDay) { particleType = 'sun'; spawnParticles(30); animateParticles(); }
      else if (id === '01' && !isDay) { particleType = 'stars'; spawnParticles(100); animateParticles(); }
      else { particleType = 'mist'; spawnParticles(20); animateParticles(); }
    }

    function spawnParticles(n) {
      for (let i = 0; i < n; i++) particles.push(makeParticle(true));
    }
    function makeParticle(random = false) {
      const y = random ? Math.random() * canvas.height : -10;
      const t = particleType;
      if (t === 'rain' || t === 'storm') return {
        x: Math.random() * canvas.width, y, vy: 10 + Math.random() * 8 + (t === 'storm' ? 6 : 0),
        vx: t === 'storm' ? -3 - Math.random() * 3 : -0.5,
        len: 10 + Math.random() * 15, alpha: 0.3 + Math.random() * 0.4,
      };
      if (t === 'snow') return {
        x: Math.random() * canvas.width, y, vy: 0.8 + Math.random() * 1.2,
        vx: Math.sin(Math.random() * Math.PI * 2) * 0.5,
        r: 1.5 + Math.random() * 2.5, alpha: 0.4 + Math.random() * 0.5, angle: Math.random() * Math.PI * 2,
      };
      if (t === 'stars') return {
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: 0.5 + Math.random() * 1.5, alpha: 0.2 + Math.random() * 0.8, twinkle: Math.random() * Math.PI * 2,
        fixed: true,
      };
      if (t === 'sun') return {
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: 1 + Math.random() * 2, alpha: 0.08 + Math.random() * 0.15,
        vx: -0.2 + Math.random() * 0.4, vy: -0.3 + Math.random() * 0.2,
        pulse: Math.random() * Math.PI * 2,
      };
      // mist
      return {
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: 40 + Math.random() * 80, alpha: 0.015 + Math.random() * 0.025,
        vx: 0.2 + Math.random() * 0.3, vy: 0, fixed: false,
      };
    }

    function animateParticles() {
      pCtx.clearRect(0, 0, canvas.width, canvas.height);
      const t = particleType;

      particles.forEach((p, i) => {
        pCtx.save();
        if (t === 'rain' || t === 'storm') {
          pCtx.strokeStyle = `rgba(160,200,255,${p.alpha})`;
          pCtx.lineWidth = 1;
          pCtx.beginPath();
          pCtx.moveTo(p.x, p.y);
          pCtx.lineTo(p.x + p.vx * 3, p.y + p.len);
          pCtx.stroke();
          p.x += p.vx; p.y += p.vy;
          if (p.y > canvas.height) { particles[i] = makeParticle(false); particles[i].x = Math.random() * canvas.width; }
        } else if (t === 'snow') {
          pCtx.fillStyle = `rgba(220,235,255,${p.alpha})`;
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          pCtx.fill();
          p.x += p.vx + Math.sin(p.angle) * 0.3; p.y += p.vy; p.angle += 0.02;
          if (p.y > canvas.height) { particles[i] = makeParticle(false); particles[i].x = Math.random() * canvas.width; }
        } else if (t === 'stars') {
          p.twinkle += 0.02;
          const a = p.alpha * (0.6 + 0.4 * Math.sin(p.twinkle));
          pCtx.fillStyle = `rgba(200,215,255,${a})`;
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          pCtx.fill();
        } else if (t === 'sun') {
          p.pulse += 0.03; p.x += p.vx; p.y += p.vy;
          const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));
          pCtx.fillStyle = `rgba(255,220,100,${a})`;
          pCtx.beginPath(); pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); pCtx.fill();
          if (p.x < -10 || p.x > canvas.width + 10 || p.y < -10 || p.y > canvas.height + 10) particles[i] = makeParticle(true);
        } else {
          pCtx.fillStyle = `rgba(200,215,230,${p.alpha})`;
          pCtx.beginPath(); pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); pCtx.fill();
          p.x += p.vx;
          if (p.x > canvas.width + p.r) p.x = -p.r;
        }
        pCtx.restore();
      });
      animFrame = requestAnimationFrame(animateParticles);
    }

    // ── HELPERS ──
    const fmt = {
      temp: (k) => Math.round(k) + '°',
      time: (unix, tz = 0) => {
        const d = new Date((unix + tz) * 1000);
        return d.toUTCString().slice(17, 22);
      },
      day: (unix) => ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(unix * 1000).getDay()],
      hour: (unix, tz = 0) => {
        const d = new Date((unix + tz) * 1000);
        const h = d.getUTCHours();
        return (h % 12 || 12) + (h < 12 ? 'am' : 'pm');
      },
    };

    function windDir(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return dirs[Math.round(deg / 45) % 8];
    }

    // ── FETCH ──
    async function fetchWeather(city) {
      if (!API_KEY) { showKeyPrompt(); return; }
      showLoading();
      try {
        const [cur, fore] = await Promise.all([
          fetch(`${API_BASE}/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=${units}`).then(r => { if (!r.ok) throw new Error(r.status === 404 ? `City "${city}" not found.` : 'API error. Check your key.'); return r.json(); }),
          fetch(`${API_BASE}/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=${units}`).then(r => { if (!r.ok) throw new Error('Forecast fetch failed.'); return r.json(); })
        ]);
        localStorage.setItem('nimbus_last_city', city);
        lastCity = city;
        render(cur, fore);
      } catch (e) {
        showError(e.message);
      }
    }

    async function fetchByCoords(lat, lon) {
      if (!API_KEY) { showKeyPrompt(); return; }
      showLoading();
      try {
        const [cur, fore] = await Promise.all([
          fetch(`${API_BASE}/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=${units}`).then(r => r.json()),
          fetch(`${API_BASE}/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=${units}`).then(r => r.json())
        ]);
        lastCity = cur.name;
        localStorage.setItem('nimbus_last_city', cur.name);
        render(cur, fore);
      } catch (e) { showError(e.message); }
    }

    // ── RENDER ──
    function render(cur, fore) {
      const tz = cur.timezone;
      const isDay = cur.weather[0].icon.endsWith('d');
      applyTheme(cur.weather[0].icon, isDay);

      const unitSym = units === 'metric' ? '°C' : '°F';
      const windUnit = units === 'metric' ? 'm/s' : 'mph';

      // 5-day: pick noon forecast per day
      const days = {};
      fore.list.forEach(f => {
        const d = new Date(f.dt * 1000);
        const key = d.toDateString();
        const hour = d.getUTCHours() + tz / 3600;
        if (!days[key]) days[key] = f;
        else if (Math.abs((hour % 24) - 12) < Math.abs(((new Date(days[key].dt * 1000).getUTCHours() + tz / 3600) % 24) - 12)) days[key] = f;
      });
      const fiveDay = Object.values(days).slice(1, 6);

      // Hourly: next 8
      const hourly = fore.list.slice(0, 8);

      // Sunrise arc %
      const nowUnix = cur.dt;
      const sr = cur.sys.sunrise, ss = cur.sys.sunset;
      const arcPct = Math.max(0, Math.min(1, (nowUnix - sr) / (ss - sr)));

      // Local time
      const localTime = new Date((cur.dt + tz) * 1000).toUTCString().slice(17, 25);

      document.getElementById('content').innerHTML = `
    <div class="hero-grid">
      <div class="main-card">
        <div class="location-line">
          <span class="location-pin">📍</span>
          <span class="location-name">${cur.name}</span>
          <span class="location-country">${cur.sys.country}</span>
          <span class="location-time">${localTime}</span>
        </div>
        <div class="temp-display">
          <div class="temp-big">${fmt.temp(cur.main.temp)}</div>
          <div class="temp-meta">
            <span class="weather-icon-big">${getIcon(cur.weather[0].icon)}</span>
            <div class="weather-desc">${cur.weather[0].description}</div>
            <div class="feels-like">Feels like ${fmt.temp(cur.main.feels_like)} · H:${fmt.temp(cur.main.temp_max)} L:${fmt.temp(cur.main.temp_min)}</div>
          </div>
        </div>
        <div class="stats-strip">
          <div class="stat-item">
            <div class="stat-icon">💧</div>
            <div class="stat-val">${cur.main.humidity}%</div>
            <div class="stat-lbl">Humidity</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">💨</div>
            <div class="stat-val">${Math.round(cur.wind.speed)} <small style="font-size:0.55em">${windUnit}</small></div>
            <div class="stat-lbl">Wind ${windDir(cur.wind.deg)}</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">👁️</div>
            <div class="stat-val">${(cur.visibility / 1000).toFixed(1)}<small style="font-size:0.55em">km</small></div>
            <div class="stat-lbl">Visibility</div>
          </div>
          <div class="stat-item">
            <div class="stat-icon">🌡️</div>
            <div class="stat-val">${cur.main.pressure}<small style="font-size:0.55em">hPa</small></div>
            <div class="stat-lbl">Pressure</div>
          </div>
        </div>
      </div>

      <div class="side-panel">
        <!-- Sun card -->
        <div class="glass-card">
          <div class="card-label">Sun & Sky</div>
          <div class="sun-row">
            <div class="sun-item">
              <div class="sun-icon">🌅</div>
              <div class="sun-time">${fmt.time(sr, tz)}</div>
              <div class="sun-name">Sunrise</div>
            </div>
            <div class="sun-item">
              <div class="sun-icon">🌇</div>
              <div class="sun-time">${fmt.time(ss, tz)}</div>
              <div class="sun-name">Sunset</div>
            </div>
          </div>
          <div class="sun-arc-wrap">
            <svg viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10 55 Q100 -10 190 55" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none"/>
              <path d="M10 55 Q100 -10 190 55" stroke="rgba(255,200,80,0.5)" stroke-width="2" fill="none"
                stroke-dasharray="230" stroke-dashoffset="${230 * (1 - arcPct)}" style="transition:stroke-dashoffset 1s ease"/>
              <circle r="6" fill="#ffd700" filter="url(#glow)">
                <animateMotion dur="0.01s" fill="freeze"
                  path="M10 55 Q100 -10 190 55"
                  keyPoints="${arcPct}" keyTimes="0" calcMode="linear"/>
              </circle>
              <defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
            </svg>
          </div>
          <div class="extra-grid">
            <div class="extra-item">
              <div class="extra-val">${cur.clouds.all}%</div>
              <div class="extra-lbl">Cloud Cover</div>
            </div>
            <div class="extra-item">
              <div class="extra-val">${cur.main.humidity > 80 ? 'High' : cur.main.humidity > 50 ? 'Mod' : 'Low'}</div>
              <div class="extra-lbl">Dew Risk</div>
            </div>
          </div>
        </div>

        <!-- Conditions card -->
        <div class="glass-card">
          <div class="card-label">Conditions</div>
          <div class="extra-grid">
            <div class="extra-item">
              <div class="extra-val">${cur.wind.gust ? Math.round(cur.wind.gust) : '—'}</div>
              <div class="extra-lbl">Gusts</div>
            </div>
            <div class="extra-item">
              <div class="extra-val">${cur.pop !== undefined ? Math.round(cur.pop * 100) + '%' : (cur.rain ? '↑' : '—')}</div>
              <div class="extra-lbl">Rain%</div>
            </div>
            <div class="extra-item">
              <div class="extra-val">${Math.round(cur.main.temp - (cur.main.feels_like))}°</div>
              <div class="extra-lbl">Wind Chill</div>
            </div>
            <div class="extra-item">
              <div class="extra-val">${isDay ? '☀️' : '🌙'}</div>
              <div class="extra-lbl">${isDay ? 'Daytime' : 'Nighttime'}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 5-DAY FORECAST -->
    <div class="forecast-row">
      ${fiveDay.map(f => `
        <div class="forecast-card">
          <div class="forecast-day">${fmt.day(f.dt)}</div>
          <span class="forecast-icon">${getIcon(f.weather[0].icon)}</span>
          <div class="forecast-hi">${fmt.temp(f.main.temp_max)}</div>
          <div class="forecast-lo">${fmt.temp(f.main.temp_min)}</div>
          <div class="forecast-desc">${f.weather[0].description}</div>
          ${f.pop > 0.1 ? `<div class="forecast-rain">💧 ${Math.round(f.pop * 100)}%</div>` : ''}
        </div>`).join('')}
    </div>

    <!-- HOURLY -->
    <div class="hourly-wrap">
      <div class="hourly-label">Next 24 Hours</div>
      <div class="hourly-inner">
        ${hourly.map(h => `
          <div class="hour-item">
            <div class="hour-time">${fmt.hour(h.dt, tz)}</div>
            <span class="hour-icon">${getIcon(h.weather[0].icon)}</span>
            <div class="hour-temp">${fmt.temp(h.main.temp)}</div>
            ${h.pop > 0.1 ? `<div class="hour-rain">💧${Math.round(h.pop * 100)}%</div>` : ''}
          </div>`).join('')}
      </div>
    </div>
  `;
    }

    // ── LOADING / ERROR ──
    function showLoading() {
      document.getElementById('content').innerHTML = `
    <div class="loading-screen">
      <div class="loader-ring"></div>
      <p>Fetching weather data...</p>
    </div>`;
    }

    function showError(msg) {
      document.getElementById('content').innerHTML = `
    <div class="loading-screen">
      <div style="font-size:3rem">⚠️</div>
      <p style="color:var(--text)">${msg}</p>
      <p style="color:var(--text-3);font-size:0.8rem">Try another city or check your API key.</p>
    </div>`;
    }

    // ── API KEY PROMPT ──
    function showKeyPrompt() {
      document.getElementById('content').innerHTML = `
    <div class="loading-screen">
      <div class="key-prompt">
        <h2>Welcome to Nimbus ✦</h2>
        <p>This dashboard uses the <strong>OpenWeatherMap API</strong>.<br>
        Enter your free API key to get started. It takes about 2 hours to activate after sign-up.</p>
        <input type="text" class="key-input" id="key-input" placeholder="Paste your API key here...">
        <button class="key-submit" id="key-submit">Save & Load Weather</button>
        <div class="key-hint">
          Get a free key at <a href="https://openweathermap.org/api" target="_blank">openweathermap.org</a> →
          free tier supports 1,000 calls/day
        </div>
      </div>
    </div>`;
      document.getElementById('key-submit').addEventListener('click', () => {
        const k = document.getElementById('key-input').value.trim();
        if (k.length < 20) { alert('That doesn\'t look like a valid key.'); return; }
        API_KEY = k;
        localStorage.setItem('nimbus_api_key', k);
        fetchWeather(lastCity || 'London');
      });
      document.getElementById('key-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('key-submit').click();
      });
    }

    // ── SEARCH ──
    document.getElementById('search-btn').addEventListener('click', doSearch);
    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
    function doSearch() {
      const city = document.getElementById('search-input').value.trim();
      if (!city) return;
      fetchWeather(city);
    }

    // ── UNIT TOGGLE ──
    document.querySelectorAll('.unit-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        units = this.dataset.unit;
        if (lastCity) fetchWeather(lastCity);
      });
    });

    // ── INIT ──
    (function init() {
      // Default stars particles while loading
      updateParticles('01', false);

      if (!API_KEY) {
        showKeyPrompt();
        return;
      }

      // Try geolocation first
      if (navigator.geolocation && !lastCity) {
        showLoading();
        navigator.geolocation.getCurrentPosition(
          pos => fetchByCoords(pos.coords.latitude, pos.coords.longitude),
          () => fetchWeather('London')
        );
      } else {
        fetchWeather(lastCity || 'London');
      }
    })();
  </script>
</body>

</html>
